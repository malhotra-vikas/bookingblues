# BookingBlues — Slack app manifest (ADR 0010)
#
# What this is: the YAML you paste into api.slack.com/apps → "Create New App"
# → "From an app manifest" → pick the BookingBlues workspace. Slack creates
# the app with the scopes, slash command, event subscriptions, and
# interactivity URLs pre-filled.
#
# Per ADR 0010, the app is installed **once** into the BookingBlues internal
# workspace — there is no per-operator OAuth flow, no `oauth_config.redirect_urls`,
# and no public distribution. All operators' escalations land in the channel
# pointed to by SLACK_DEFAULT_CHANNEL_ID.
#
# After Slack creates the app:
#   1. "OAuth & Permissions" → "Install to Workspace" → approve scopes
#   2. Copy the "Bot User OAuth Token" (xoxb-…)        → SLACK_BOT_TOKEN
#   3. Basic Information → "Signing Secret"            → SLACK_SIGNING_SECRET
#   4. In Slack, get the `#hitl` channel ID            → SLACK_DEFAULT_CHANNEL_ID
#   5. `/invite @BookingBlues` in `#hitl`              (otherwise not_in_channel)
#
# IMPORTANT — replace `https://bookingbluesapi-production.up.railway.app` with
# your actual API URL before pasting. The manifest is just YAML; you can also
# edit each URL in the Slack dashboard after creation.

display_information:
  name: BookingBlues
  description: Human-in-the-loop for missed-call bookings — pages our team when the bot needs help.
  background_color: "#1e40af"
  long_description: >-
    BookingBlues converts missed calls into booked appointments. When the AI
    bot can't make progress, a caller asks for a human, or staff flag a thread
    from the admin dashboard, BookingBlues posts an escalation in #hitl and
    bridges the SMS conversation: reply in-thread to send an SMS to the
    caller; use /bb back-to-bot to hand control back to the AI.

features:
  bot_user:
    display_name: BookingBlues
    always_online: true

  slash_commands:
    - command: /bb
      url: https://bookingbluesapi-production.up.railway.app/webhooks/slack/commands
      description: BookingBlues commands — try `/bb help`
      usage_hint: "[resolve | back-to-bot | close-spam | show-number | book <ISO>]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - commands

settings:
  event_subscriptions:
    request_url: https://bookingbluesapi-production.up.railway.app/webhooks/slack/events
    bot_events:
      # Catch agent replies inside escalation threads so we can bridge them
      # back to the caller as SMS. The bridge service ignores anything outside
      # an open escalation.
      - message.channels
      - message.groups

  interactivity:
    is_enabled: true
    request_url: https://bookingbluesapi-production.up.railway.app/webhooks/slack/interactivity

  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
